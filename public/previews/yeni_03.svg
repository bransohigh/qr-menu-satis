<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- Restoran Kategori Akışı — Üst arama, kategori section'ları, geniş kartlar -->
  <defs>
    <linearGradient id="hdr03" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="btn03" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <clipPath id="clip03"><rect width="400" height="300" rx="12"/></clipPath>
  </defs>
  <rect width="400" height="300" fill="#f5f5f0" clip-path="url(#clip03)"/>
  <!-- Sticky header with search -->
  <rect width="400" height="52" fill="url(#hdr03)"/>
  <text x="28" y="23" font-size="16">🍽</text>
  <rect x="52" y="14" width="228" height="24" rx="8" fill="rgba(255,255,255,.2)"/>
  <text x="166" y="30" font-size="10" fill="rgba(255,255,255,.7)" font-family="Arial" text-anchor="middle">🔍  Ne aramıştınız?</text>
  <!-- Category Section 1 -->
  <rect x="12" y="62" width="200" height="12" rx="4" fill="#1f2937"/>
  <rect x="216" y="68" width="172" height="2" rx="1" fill="#7c3aed" opacity=".3"/>
  <!-- Wide card 1 -->
  <rect x="12" y="82" width="376" height="72" rx="14" fill="#fff" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="12" y="82" width="376" height="38" rx="14" fill="#e0e7ff"/>
  <text x="200" y="106" font-size="22" text-anchor="middle">🍝</text>
  <rect x="22" y="126" width="120" height="8" rx="3" fill="#111827"/>
  <rect x="22" y="140" width="80" height="6" rx="3" fill="#9ca3af"/>
  <rect x="290" y="122" width="88" height="24" rx="8" fill="url(#btn03)"/>
  <text x="334" y="138" font-size="9" fill="#fff" font-family="Arial" text-anchor="middle" font-weight="bold">Sepete Ekle</text>
  <text x="160" y="140" font-size="10" fill="#7c3aed" font-family="Arial" font-weight="bold">185 ₺</text>
  <!-- Category Section 2 -->
  <rect x="12" y="164" width="150" height="10" rx="4" fill="#1f2937" opacity=".7"/>
  <rect x="166" y="169" width="222" height="2" rx="1" fill="#7c3aed" opacity=".25"/>
  <!-- Wide card 2 -->
  <rect x="12" y="180" width="376" height="72" rx="14" fill="#fff" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="12" y="180" width="376" height="38" rx="14" fill="#fef3c7"/>
  <text x="200" y="204" font-size="22" text-anchor="middle">🥩</text>
  <rect x="22" y="224" width="100" height="8" rx="3" fill="#111827"/>
  <rect x="22" y="238" width="70" height="6" rx="3" fill="#9ca3af"/>
  <rect x="290" y="220" width="88" height="24" rx="8" fill="url(#btn03)"/>
  <text x="334" y="236" font-size="9" fill="#fff" font-family="Arial" text-anchor="middle" font-weight="bold">Sepete Ekle</text>
  <text x="160" y="238" font-size="10" fill="#7c3aed" font-family="Arial" font-weight="bold">245 ₺</text>
  <!-- New badge -->
  <rect x="310" y="264" width="76" height="22" rx="11" fill="url(#btn03)"/>
  <text x="348" y="279" font-size="10" fill="#fff" font-family="Arial" text-anchor="middle" font-weight="bold">● YENİ TEMA</text>
