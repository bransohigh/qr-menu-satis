<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- Köy Kahvaltısı — Amber/Stone sıcak, geleneksel serif -->
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>
  <!-- Arka plan -->
  <rect width="400" height="300" fill="#fffbeb"/>
  <!-- Header -->
  <rect width="400" height="44" fill="#fff" stroke="#fde68a" stroke-width="1"/>
  <rect x="14" y="12" width="80" height="20" rx="4" fill="#fde68a"/>
  <circle cx="370" cy="22" r="14" fill="#fef3c7"/>
  <!-- Hero banner -->
  <rect y="44" width="400" height="90" fill="url(#g1)"/>
  <rect x="100" y="62" width="200" height="14" rx="4" fill="rgba(255,255,255,.4)"/>
  <rect x="130" y="84" width="140" height="30" rx="4" fill="rgba(255,255,255,.25)"/>
  <!-- Ürün kartları yatay (resim solda) -->
  <rect x="16" y="152" width="368" height="64" rx="10" fill="#fff" stroke="#fde68a" stroke-width="1.5"/>
  <rect x="16" y="152" width="72" height="64" rx="10" fill="#fef9c3"/>
  <rect x="102" y="164" width="100" height="10" rx="3" fill="#d97706" opacity=".7"/>
  <rect x="102" y="180" width="70" height="8" rx="3" fill="#a8a29e" opacity=".5"/>
  <rect x="340" y="172" width="32" height="22" rx="6" fill="#fde68a"/>

  <rect x="16" y="226" width="368" height="60" rx="10" fill="#fff" stroke="#fde68a" stroke-width="1.5"/>
  <rect x="16" y="226" width="72" height="60" rx="10" fill="#fef9c3"/>
  <rect x="102" y="238" width="120" height="10" rx="3" fill="#d97706" opacity=".7"/>
  <rect x="102" y="254" width="80" height="8" rx="3" fill="#a8a29e" opacity=".5"/>
  <!-- Tema adı -->
  <text x="200" y="292" font-family="Georgia,serif" font-size="11" fill="#92400e" text-anchor="middle" opacity=".7">Köy Kahvaltısı</text>
</svg>
