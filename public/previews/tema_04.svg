<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- Premium Koyu — #070714/Mor gradyan, glassmorphism -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity=".25"/>
      <stop offset="100%" stop-color="#070714" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <!-- Arka plan -->
  <rect width="400" height="300" fill="#070714"/>
  <rect width="400" height="300" fill="url(#glow)"/>
  <!-- Header glassmorphism -->
  <rect width="400" height="44" fill="rgba(7,7,20,.85)" opacity=".95"/>
  <rect width="400" height="1" y="43" fill="rgba(139,92,246,.2)"/>
  <rect x="14" y="12" width="90" height="20" rx="6" fill="url(#pg)" opacity=".15"/>
  <text x="59" y="26" font-size="12" fill="url(#pg)" font-family="Arial" text-anchor="middle" opacity=".9">✦ İşletme</text>
  <!-- Hero -->
  <rect y="44" width="400" height="100" fill="transparent"/>
  <circle cx="200" cy="80" r="20" fill="rgba(139,92,246,.15)" stroke="rgba(139,92,246,.3)" stroke-width="1"/>
  <text x="200" y="85" font-size="12" fill="rgba(168,85,247,.8)" text-anchor="middle">✦</text>
  <rect x="100" y="106" width="200" height="14" rx="5" fill="url(#pg)" opacity=".3"/>
  <!-- Glass kartlar -->
  <rect x="16" y="156" width="112" height="130" rx="16" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.08)" stroke-width="1"/>
  <rect x="16" y="156" width="112" height="56" rx="16" fill="rgba(124,58,237,.12)"/>
  <rect x="26" y="222" width="60" height="8" rx="3" fill="url(#pg)" opacity=".5"/>
  <rect x="26" y="236" width="40" height="6" rx="3" fill="#64748b" opacity=".5"/>
  <rect x="26" y="252" width="44" height="18" rx="8" fill="url(#pg)" opacity=".4"/>

  <rect x="144" y="156" width="112" height="130" rx="16" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.08)" stroke-width="1"/>
  <rect x="144" y="156" width="112" height="56" rx="16" fill="rgba(124,58,237,.12)"/>
  <rect x="154" y="222" width="70" height="8" rx="3" fill="url(#pg)" opacity=".5"/>
  <rect x="154" y="236" width="50" height="6" rx="3" fill="#64748b" opacity=".5"/>
  <rect x="154" y="252" width="44" height="18" rx="8" fill="url(#pg)" opacity=".4"/>

  <rect x="272" y="156" width="112" height="130" rx="16" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.08)" stroke-width="1"/>
  <rect x="272" y="156" width="112" height="56" rx="16" fill="rgba(124,58,237,.12)"/>
  <rect x="282" y="222" width="55" height="8" rx="3" fill="url(#pg)" opacity=".5"/>
  <rect x="282" y="236" width="45" height="6" rx="3" fill="#64748b" opacity=".5"/>
  <rect x="282" y="252" width="44" height="18" rx="8" fill="url(#pg)" opacity=".4"/>

  <text x="200" y="297" font-family="Arial,sans-serif" font-size="10" fill="#c084fc" text-anchor="middle" opacity=".8">Premium Koyu</text>
</svg>
