<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- Sushi Modern — Koyu gradyan, ikonlu kategori şeridi, 2 sütun kart -->
  <defs>
    <linearGradient id="bg01" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f3460"/>
    </linearGradient>
    <linearGradient id="acc01" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e94560"/>
      <stop offset="100%" stop-color="#f7a04b"/>
    </linearGradient>
    <clipPath id="clip01"><rect width="400" height="300" rx="12"/></clipPath>
  </defs>
  <rect width="400" height="300" fill="url(#bg01)" clip-path="url(#clip01)"/>
  <!-- Header -->
  <rect width="400" height="48" fill="rgba(255,255,255,.05)"/>
  <rect x="16" y="14" width="100" height="20" rx="10" fill="rgba(233,69,96,.2)"/>
  <text x="66" y="29" font-size="11" fill="#e94560" font-family="Arial" text-anchor="middle" font-weight="bold">🍣 Sushi Modern</text>
  <!-- Category strip -->
  <rect y="56" width="400" height="52" fill="rgba(255,255,255,.04)"/>
  <rect x="12" y="66" width="60" height="32" rx="12" fill="rgba(233,69,96,.3)"/>
  <text x="42" y="87" font-size="18" text-anchor="middle">🍣</text>
  <rect x="80" y="66" width="60" height="32" rx="12" fill="rgba(255,255,255,.08)"/>
  <text x="110" y="87" font-size="18" text-anchor="middle">🍜</text>
  <rect x="148" y="66" width="60" height="32" rx="12" fill="rgba(255,255,255,.08)"/>
  <text x="178" y="87" font-size="18" text-anchor="middle">🍶</text>
  <rect x="216" y="66" width="60" height="32" rx="12" fill="rgba(255,255,255,.08)"/>
  <text x="246" y="87" font-size="18" text-anchor="middle">🥤</text>
  <!-- Product cards 2-col -->
  <rect x="12" y="118" width="182" height="84" rx="14" fill="rgba(255,255,255,.07)"/>
  <rect x="12" y="118" width="182" height="44" rx="14" fill="rgba(233,69,96,.15)"/>
  <text x="103" y="146" font-size="22" text-anchor="middle">🍣</text>
  <rect x="22" y="168" width="80" height="8" rx="3" fill="#fff" opacity=".7"/>
  <rect x="22" y="182" width="50" height="6" rx="3" fill="url(#acc01)" opacity=".8"/>
  <rect x="150" y="180" width="28" height="14" rx="7" fill="url(#acc01)"/>
  <text x="164" y="191" font-size="10" fill="#fff" text-anchor="middle" font-weight="bold">+</text>
  <rect x="206" y="118" width="182" height="84" rx="14" fill="rgba(255,255,255,.07)"/>
  <rect x="206" y="118" width="182" height="44" rx="14" fill="rgba(247,160,75,.15)"/>
  <text x="297" y="146" font-size="22" text-anchor="middle">🍜</text>
  <rect x="216" y="168" width="80" height="8" rx="3" fill="#fff" opacity=".7"/>
  <rect x="216" y="182" width="50" height="6" rx="3" fill="url(#acc01)" opacity=".8"/>
  <rect x="344" y="180" width="28" height="14" rx="7" fill="url(#acc01)"/>
  <text x="358" y="191" font-size="10" fill="#fff" text-anchor="middle" font-weight="bold">+</text>
  <!-- Second row -->
  <rect x="12" y="210" width="182" height="80" rx="14" fill="rgba(255,255,255,.06)"/>
  <text x="103" y="256" font-size="22" text-anchor="middle">🥤</text>
  <rect x="22" y="274" width="60" height="6" rx="3" fill="#fff" opacity=".5"/>
  <rect x="206" y="210" width="182" height="80" rx="14" fill="rgba(255,255,255,.06)"/>
  <text x="297" y="256" font-size="22" text-anchor="middle">🍶</text>
  <rect x="216" y="274" width="60" height="6" rx="3" fill="#fff" opacity=".5"/>
  <!-- New badge -->
  <rect x="310" y="8" width="76" height="22" rx="11" fill="url(#acc01)"/>
  <text x="348" y="23" font-size="10" fill="#fff" font-family="Arial" text-anchor="middle" font-weight="bold">● YENİ TEMA</text>
