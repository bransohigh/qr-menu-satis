  <rect x="226" y="122" width="80" height="22" rx="11" fill="#d1fae5"/>
  <!-- Ürünler: yuvarlak thumbnail + yatay liste -->
  <circle cx="42" cy="166" r="24" fill="#d1fae5"/>
  <rect x="76" y="154" width="120" height="10" rx="3" fill="#3f3f46" opacity=".6"/>
  <rect x="76" y="170" width="80" height="8" rx="3" fill="#a1a1aa" opacity=".5"/>
  <rect x="340" y="158" width="44" height="16" rx="6" fill="#16a34a" opacity=".7"/>

  <rect x="16" y="195" width="368" height="1" fill="#f0fdf4"/>

  <circle cx="42" cy="224" r="24" fill="#d1fae5"/>
  <rect x="76" y="212" width="140" height="10" rx="3" fill="#3f3f46" opacity=".6"/>
  <rect x="76" y="228" width="90" height="8" rx="3" fill="#a1a1aa" opacity=".5"/>
  <rect x="340" y="216" width="44" height="16" rx="6" fill="#16a34a" opacity=".7"/>

  <circle cx="42" cy="270" r="24" fill="#d1fae5"/>
  <rect x="76" y="258" width="100" height="10" rx="3" fill="#3f3f46" opacity=".6"/>
  <rect x="76" y="274" width="70" height="8" rx="3" fill="#a1a1aa" opacity=".5"/>
  <rect x="340" y="262" width="44" height="16" rx="6" fill="#16a34a" opacity=".7"/>

  <text x="200" y="296" font-family="Arial,sans-serif" font-size="10" fill="#16a34a" text-anchor="middle" opacity=".7">Vegan Minimal</text>
