  <rect y="44" width="400" height="3" fill="#16a34a" opacity=".3"/>
  <!-- Hero minimal -->
  <rect y="60" width="400" height="52" fill="#f0fdf4"/>
  <rect x="90" y="68" width="220" height="14" rx="5" fill="#16a34a" opacity=".25"/>
  <rect x="150" y="88" width="100" height="10" rx="4" fill="#16a34a" opacity=".15"/>
  <!-- Kategori pills -->
  <rect x="16" y="122" width="60" height="22" rx="11" fill="#d1fae5"/>
