  <rect width="400" height="300" fill="#fff"/>
  <!-- Header -->
  <rect width="400" height="44" fill="#fff" stroke="#d1fae5" stroke-width="1.5"/>
  <rect x="14" y="14" width="80" height="16" rx="8" fill="#d1fae5"/>
  <rect x="300" y="12" width="50" height="20" rx="10" fill="#d1fae5"/>
  <rect x="360" y="12" width="28" height="20" rx="10" fill="#d1fae5"/>
